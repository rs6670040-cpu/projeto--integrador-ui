<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#053b2b">
  <title>Oficinas – Educação ambiental na prática</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/app.css">
  <link rel="stylesheet" href="oficinas.css">
</head>
<body>
  <div class="app" id="app" hidden>
    <header id="shell-topo"></header>
    <nav id="shell-menu"></nav>
    <main class="principal" id="principal" tabindex="-1">

      <header class="pagina-cabecalho">
        <div>
          <h1>Oficinas</h1>
          <p id="descricao"></p>
        </div>
        <div class="pagina-cabecalho__acoes">
          <a class="btn btn--primario" id="btn-nova" href="../oficina-form/oficina-form.html" hidden>Nova oficina</a>
        </div>
      </header>

      <div id="abas"></div>

      <form class="filtros" id="filtros" role="search" aria-label="Filtrar oficinas" novalidate>
        <div class="campo">
          <label for="busca">Buscar oficina</label>
          <input id="busca" type="search" placeholder="Ex.: garrafa, jogo, puff…" autocomplete="off">
        </div>
        <div class="campo campo--curto">
          <label for="material">Material</label>
          <select id="material"><option value="">Todos</option></select>
        </div>
        <p class="filtros__resumo" id="resumo" aria-live="polite"></p>
      </form>

      <div class="grade" id="lista"></div>
    </main>
  </div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/data.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/componentes.js"></script>
  <script src="../../assets/js/app-shell.js"></script>
  <script src="oficinas.js"></script>
</body>
</html>
